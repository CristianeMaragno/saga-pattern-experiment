# Stack completo do experimento: 5 serviços, 5 bancos, Kafka, Eventuate CDC e
# observabilidade. Sobe com um único comando:
#
#     docker compose up --build
#
# Os fatores experimentais (estratégia, cenário e posição de falha, carga) vêm
# do arquivo .env — ver .env.example e o README na raiz.

x-experimento: &experimento
  EXPERIMENT_RUN_ID: ${EXPERIMENT_RUN_ID:-local}
  RECOVERY_STRATEGY: ${RECOVERY_STRATEGY:-BACKWARD}
  FAULT_SCENARIO: ${FAULT_SCENARIO:-NONE}
  FAULT_POSITION: ${FAULT_POSITION:-T4}
  RECOVERY_RETRY_LIMIT: ${RECOVERY_RETRY_LIMIT:-3}
  RECOVERY_RETRY_BACKOFF_MS: ${RECOVERY_RETRY_BACKOFF_MS:-200}
  RECOVERY_RETRY_BACKOFF_MAX_MS: ${RECOVERY_RETRY_BACKOFF_MAX_MS:-5000}
  FAULT_TEMPORARY_FAILURES: ${FAULT_TEMPORARY_FAILURES:-2}
  APPROVAL_DECISION_DELAY_SECONDS: ${APPROVAL_DECISION_DELAY_SECONDS:-2}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

x-app-healthcheck: &app-healthcheck
  test: ["CMD-SHELL", "wget -q --spider http://localhost:$${SERVER_PORT}/actuator/health || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 60s

x-db-base: &db-base
  image: postgres:16-alpine
  restart: unless-stopped
  networks: [tcc-network]

services:
  # Mensageria

  # Kafka em modo KRaft: sem Zookeeper, um container a menos e o modo
  # recomendado nas versões atuais.
  kafka:
    image: apache/kafka:3.9.0
    container_name: tcc-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: tcc-saga-cluster-000001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [tcc-network]

  # Zookeeper existe apenas para a eleição de líder do Eventuate CDC.
  # O Kafka acima NÃO o utiliza (roda em KRaft).
  zookeeper:
    image: zookeeper:3.9
    container_name: tcc-zookeeper
    restart: unless-stopped
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "*"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [tcc-network]

  # Inspeção visual dos tópicos e das mensagens da coreografia.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tcc-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tcc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [tcc-network]

  # Eventuate CDC — lê a tabela de outbox dos 5 bancos e publica no Kafka
  #
  # Uma única instância atende os 5 bancos, via um "reader" e um "pipeline" por
  # banco. Os readers usam o modo polling: assim o Postgres não precisa de
  # wal_level=logical nem do plugin wal2json, que não vem na imagem oficial.
  eventuate-cdc:
    image: eventuateio/eventuate-cdc-service:0.19.0.RELEASE
    container_name: tcc-eventuate-cdc
    restart: unless-stopped
    ports:
      - "8099:8080"
    depends_on:
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
      travel-db:
        condition: service_healthy
      approval-db:
        condition: service_healthy
      booking-db:
        condition: service_healthy
      payment-db:
        condition: service_healthy
      audit-db:
        condition: service_healthy
    environment:
      EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENTUATELOCAL_ZOOKEEPER_CONNECTION_STRING: zookeeper:2181

      EVENTUATE_CDC_READER_TRAVELREADER_TYPE: polling
      EVENTUATE_CDC_READER_TRAVELREADER_DATASOURCEURL: jdbc:postgresql://travel-db:5432/travel_db
      EVENTUATE_CDC_READER_TRAVELREADER_DATASOURCEUSERNAME: travel_user
      EVENTUATE_CDC_READER_TRAVELREADER_DATASOURCEPASSWORD: travel_password
      EVENTUATE_CDC_READER_TRAVELREADER_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_TRAVELREADER_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/travel
      EVENTUATE_CDC_PIPELINE_TRAVELPIPELINE_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_TRAVELPIPELINE_READER: TRAVELREADER

      EVENTUATE_CDC_READER_APPROVALREADER_TYPE: polling
      EVENTUATE_CDC_READER_APPROVALREADER_DATASOURCEURL: jdbc:postgresql://approval-db:5432/approval_db
      EVENTUATE_CDC_READER_APPROVALREADER_DATASOURCEUSERNAME: approval_user
      EVENTUATE_CDC_READER_APPROVALREADER_DATASOURCEPASSWORD: approval_password
      EVENTUATE_CDC_READER_APPROVALREADER_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_APPROVALREADER_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/approval
      EVENTUATE_CDC_PIPELINE_APPROVALPIPELINE_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_APPROVALPIPELINE_READER: APPROVALREADER

      EVENTUATE_CDC_READER_BOOKINGREADER_TYPE: polling
      EVENTUATE_CDC_READER_BOOKINGREADER_DATASOURCEURL: jdbc:postgresql://booking-db:5432/booking_db
      EVENTUATE_CDC_READER_BOOKINGREADER_DATASOURCEUSERNAME: booking_user
      EVENTUATE_CDC_READER_BOOKINGREADER_DATASOURCEPASSWORD: booking_password
      EVENTUATE_CDC_READER_BOOKINGREADER_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_BOOKINGREADER_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/booking
      EVENTUATE_CDC_PIPELINE_BOOKINGPIPELINE_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_BOOKINGPIPELINE_READER: BOOKINGREADER

      EVENTUATE_CDC_READER_PAYMENTREADER_TYPE: polling
      EVENTUATE_CDC_READER_PAYMENTREADER_DATASOURCEURL: jdbc:postgresql://payment-db:5432/payment_db
      EVENTUATE_CDC_READER_PAYMENTREADER_DATASOURCEUSERNAME: payment_user
      EVENTUATE_CDC_READER_PAYMENTREADER_DATASOURCEPASSWORD: payment_password
      EVENTUATE_CDC_READER_PAYMENTREADER_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_PAYMENTREADER_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/payment
      EVENTUATE_CDC_PIPELINE_PAYMENTPIPELINE_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_PAYMENTPIPELINE_READER: PAYMENTREADER

      EVENTUATE_CDC_READER_AUDITREADER_TYPE: polling
      EVENTUATE_CDC_READER_AUDITREADER_DATASOURCEURL: jdbc:postgresql://audit-db:5432/audit_db
      EVENTUATE_CDC_READER_AUDITREADER_DATASOURCEUSERNAME: audit_user
      EVENTUATE_CDC_READER_AUDITREADER_DATASOURCEPASSWORD: audit_password
      EVENTUATE_CDC_READER_AUDITREADER_DATASOURCEDRIVERCLASSNAME: org.postgresql.Driver
      EVENTUATE_CDC_READER_AUDITREADER_LEADERSHIPLOCKPATH: /eventuate/cdc/leader/audit
      EVENTUATE_CDC_PIPELINE_AUDITPIPELINE_TYPE: eventuate-tram
      EVENTUATE_CDC_PIPELINE_AUDITPIPELINE_READER: AUDITREADER
    networks: [tcc-network]

  # Bancos — um por serviço, como no diagrama de arquitetura.
  travel-db:
    <<: *db-base
    container_name: tcc-travel-db
    environment:
      POSTGRES_DB: travel_db
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: travel_password
    ports: ["5432:5432"]
    volumes:
      - travel_data:/var/lib/postgresql/data
      - ./travel/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_user -d travel_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  approval-db:
    <<: *db-base
    container_name: tcc-approval-db
    environment:
      POSTGRES_DB: approval_db
      POSTGRES_USER: approval_user
      POSTGRES_PASSWORD: approval_password
    ports: ["5433:5432"]
    volumes:
      - approval_data:/var/lib/postgresql/data
      - ./approval/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approval_user -d approval_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  booking-db:
    <<: *db-base
    container_name: tcc-booking-db
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_password
    ports: ["5434:5432"]
    volumes:
      - booking_data:/var/lib/postgresql/data
      - ./booking/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  payment-db:
    <<: *db-base
    container_name: tcc-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
    ports: ["5435:5432"]
    volumes:
      - payment_data:/var/lib/postgresql/data
      - ./payment/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  audit-db:
    <<: *db-base
    container_name: tcc-audit-db
    environment:
      POSTGRES_DB: audit_db
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_password
    ports: ["5436:5432"]
    volumes:
      - audit_data:/var/lib/postgresql/data
      - ./audit/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d audit_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Um único pgAdmin para os cinco bancos, no lugar dos cinco que colidiam na
  # porta 5050 quando cada serviço subia o seu.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tcc-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    networks: [tcc-network]

  # Serviços
  travel:
    build:
      context: ./travel
    container_name: tcc-travel
    restart: unless-stopped
    environment:
      <<: *experimento
      SERVER_PORT: 8080
      DB_HOST: travel-db
      DB_PORT: 5432
      DB_NAME: travel_db
      DB_USER: travel_user
      DB_PASSWORD: travel_password
    ports: ["8080:8080"]
    depends_on:
      travel-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [tcc-network]

  approval:
    build:
      context: ./approval
    container_name: tcc-approval
    restart: unless-stopped
    environment:
      <<: *experimento
      SERVER_PORT: 8081
      DB_HOST: approval-db
      DB_PORT: 5432
      DB_NAME: approval_db
      DB_USER: approval_user
      DB_PASSWORD: approval_password
    ports: ["8081:8081"]
    depends_on:
      approval-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [tcc-network]

  booking:
    build:
      context: ./booking
    container_name: tcc-booking
    restart: unless-stopped
    environment:
      <<: *experimento
      SERVER_PORT: 8082
      DB_HOST: booking-db
      DB_PORT: 5432
      DB_NAME: booking_db
      DB_USER: booking_user
      DB_PASSWORD: booking_password
    ports: ["8082:8082"]
    depends_on:
      booking-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [tcc-network]

  payment:
    build:
      context: ./payment
    container_name: tcc-payment
    restart: unless-stopped
    environment:
      <<: *experimento
      SERVER_PORT: 8083
      DB_HOST: payment-db
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USER: payment_user
      DB_PASSWORD: payment_password
    ports: ["8083:8083"]
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [tcc-network]

  audit:
    build:
      context: ./audit
    container_name: tcc-audit
    restart: unless-stopped
    environment:
      <<: *experimento
      SERVER_PORT: 8084
      DB_HOST: audit-db
      DB_PORT: 5432
      DB_NAME: audit_db
      DB_USER: audit_user
      DB_PASSWORD: audit_password
    ports: ["8084:8084"]
    depends_on:
      audit-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [tcc-network]

  # Observabilidade operacional (complementar: os números da monografia saem da
  # tabela de auditoria do serviço audit, não daqui)

  prometheus:
    image: prom/prometheus:latest
    container_name: tcc-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [tcc-network]

  grafana:
    image: grafana/grafana:latest
    container_name: tcc-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [tcc-network]

volumes:
  travel_data:
  approval_data:
  booking_data:
  payment_data:
  audit_data:
  grafana_data:

networks:
  tcc-network:
    driver: bridge
