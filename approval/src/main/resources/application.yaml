spring:
  application:
    name: approval-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:approval_db}
    username: ${DB_USER:approval_user}
    password: ${DB_PASSWORD:approval_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Esquema e dados de exemplo já são criados pelo init.sql do container postgres
  sql:
    init:
      mode: never

# Eventuate Tram: o broker onde o Eventuate CDC publica o conteúdo da outbox
eventuatelocal:
  kafka:
    bootstrap:
      servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ---------------------------------------------------------------------------
# Fatores experimentais da rodada atual.
# Todos vêm de variável de ambiente para que o script da matriz troque de
# combinação apenas reiniciando os containers, sem tocar em código.
# ---------------------------------------------------------------------------
experimento:
  run-id: ${EXPERIMENT_RUN_ID:local}
  estrategia: ${RECOVERY_STRATEGY:BACKWARD}
  cenario-falha: ${FAULT_SCENARIO:NONE}
  posicao-falha: ${FAULT_POSITION:T4}
  limite-tentativas: ${RECOVERY_RETRY_LIMIT:3}
  backoff-inicial-ms: ${RECOVERY_RETRY_BACKOFF_MS:200}
  backoff-maximo-ms: ${RECOVERY_RETRY_BACKOFF_MAX_MS:5000}
  falhas-temporarias: ${FAULT_TEMPORARY_FAILURES:2}
  atraso-decisao-aprovacao-segundos: ${APPROVAL_DECISION_DELAY_SECONDS:2}
  motor:
    intervalo-ms: ${RECOVERY_ENGINE_INTERVAL_MS:100}
    tamanho-lote: ${RECOVERY_ENGINE_BATCH_SIZE:200}

# Configuração do Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      simple:
        enabled: true

# Configuração de logs
logging:
  level:
    root: INFO
    com.tcc.approval: DEBUG
    com.tcc.saga: DEBUG
    org.springframework.web: INFO
    org.springframework.data: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Configuração do servidor
server:
  port: 8081
  servlet:
    context-path: /
